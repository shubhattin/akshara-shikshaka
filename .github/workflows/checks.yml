name: App Checks

on:
  - push

permissions:
  contents: read

env:
  VITE_BETTER_AUTH_URL: http://localhost:3000
  PG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  OPENAI_API_KEY: sk_proj_1234567890
  OPENROUTER_API_KEY: or_test_123
  AWS_REGION: region-123
  AWS_ACCESS_KEY_ID: access-123
  AWS_SECRET_ACCESS_KEY: secret-123
  AWS_S3_FILES_BUCKET_NAME: bucket-123
  UPSTASH_REDIS_REST_URL: https://example.upstash.io
  UPSTASH_REDIS_REST_TOKEN: token-123

jobs:
  type_build_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: |
          bun run build
          bun run check
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: |
          bun run test
