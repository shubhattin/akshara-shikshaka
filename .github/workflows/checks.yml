name: App Checks

on:
  - push

permissions:
  contents: read

env:
  VITE_BETTER_AUTH_URL: http://localhost:3000
  PG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  OPENAI_API_KEY: sk_proj_1234567890
  OPENROUTER_API_KEY: or_test_123
  AWS_REGION: region-123
  AWS_ACCESS_KEY_ID: access-123
  AWS_SECRET_ACCESS_KEY: secret-123
  AWS_S3_FILES_BUCKET_NAME: bucket-123
  UPSTASH_REDIS_REST_URL: https://example.upstash.io
  UPSTASH_REDIS_REST_TOKEN: token-123
  QSTASH_TOKEN: qstash-token-123
  QSTASH_CURRENT_SIGNING_KEY: sig_current_123
  QSTASH_NEXT_SIGNING_KEY: sig_next_123

jobs:
  type_build_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: |
          bun run build
          bun run check
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: |
          bun run test
